services:
  postgres:
    image: postgres:16-alpine
    container_name: campusland-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: campusland-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_JWT_ISSUER: campusland-crm
      SECURITY_JWT_TTL_MINUTES: 120
      LINKEDIN_API_KEY: ${LINKEDIN_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      MICROSOFT_ACCESS_TOKEN: ${MICROSOFT_ACCESS_TOKEN:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
    ports:
      - "8080:8080"

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: campusland-scraper
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      ALLOWED_ORIGINS: http://localhost:3000,http://campusland-frontend
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusland-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - scraper
    ports:
      - "3000:80"

volumes:
  postgres_data:
