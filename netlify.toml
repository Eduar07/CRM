[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* → Spring Boot backend en Render
[[redirects]]
  from   = "/api/*"
  to     = "https://TU_BACKEND.onrender.com/api/:splat"
  status = 200
  force  = true

# Proxy /scraper-api/* → Scraper en Render
[[redirects]]
  from   = "/scraper-api/*"
  to     = "https://TU_SCRAPER.onrender.com/:splat"
  status = 200
  force  = true

# SPA fallback — todas las rutas van a index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
