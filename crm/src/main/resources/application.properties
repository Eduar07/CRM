spring.application.name=crm

# ── Base de datos ──────────────────────────────────────────────────────────────
# Local: docker compose up -d postgres
# Producción: sobreescribir SPRING_DATASOURCE_URL con la URL de Supabase/Render
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:campusland_crm}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# ── JWT ────────────────────────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET:campusland-crm-super-secret-key-2024-production-ready-minimum-256bits}
security.jwt.issuer=campusland-crm
security.jwt.ttl-minutes=120

# ── Integraciones ──────────────────────────────────────────────────────────────
integrations.email.base-url=http://localhost:8081
integrations.email.api-key=${EMAIL_API_KEY:dev-email-api-key}
integrations.hunter.base-url=http://localhost:8082
integrations.hunter.api-key=${HUNTER_API_KEY:dev-hunter-api-key}
integrations.linkedin.base-url=http://localhost:8083
integrations.linkedin.api-key=${LINKEDIN_API_KEY:dev-linkedin-api-key}
integrations.apollo.base-url=http://localhost:8084
integrations.apollo.api-key=${APOLLO_API_KEY:dev-apollo-api-key}
integrations.microsoft.graph-base-url=https://graph.microsoft.com
integrations.microsoft.access-token=${MICROSOFT_ACCESS_TOKEN:dev-microsoft-access-token}
integrations.microsoft.oauth-base-url=https://login.microsoftonline.com/common
integrations.microsoft.client-id=${MICROSOFT_CLIENT_ID:dev-client-id}
integrations.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:dev-client-secret}
integrations.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:8080/api/auth/microsoft/callback}
